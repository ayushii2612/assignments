<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Assignment 15</title></head>
<body>
  <form action="#" method="post">
    <fieldset>
      <legend>Personal Information</legend>
      <p><label for="name">Name:</label> <input type="text" id="name" name="name"></p>
      <p><label for="email">Email:</label> <input type="email" id="email" name="email"></p>
      <p><label for="pass">Password:</label> <input type="password" id="pass" name="pass"></p>
      <p><label for="dob">Date of Birth:</label> <input type="date" id="dob" name="dob"></p>
      <p><label for="age">Age:</label> <input type="number" id="age" name="age"></p>
    </fieldset>

    <fieldset>
      <legend>Gender</legend>
      <input type="radio" id="m" name="gender" value="male"><label for="m">Male</label>
      <input type="radio" id="f" name="gender" value="female"><label for="f">Female</label>
    </fieldset>

    <fieldset>
      <legend>Hobbies</legend>
      <input type="checkbox" id="h1" name="hobby" value="music"><label for="h1">Music</label>
      <input type="checkbox" id="h2" name="hobby" value="sports"><label for="h2">Sports</label>
    </fieldset>

    <p><input type="submit" value="Submit"> <input type="reset" value="Reset"></p>
  </form>
</body>
</html>
